<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Main brand gradient: cyan → indigo → violet -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#38BDF8"/>
      <stop offset="50%"  stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Subtle inner edge highlight -->
    <linearGradient id="edge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Ambient glow behind mark -->
    <filter id="ambient" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur"/>
    </filter>

    <!-- Sharp drop shadow for depth -->
    <filter id="depth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10"
        flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ── Dark background squircle ── -->
  <rect width="512" height="512" rx="116" fill="#09090B"/>

  <!-- ── Ambient glow layer ── -->
  <rect width="512" height="512" rx="116"
    fill="url(#brand-grad)" opacity="0.1"
    filter="url(#ambient)"/>

  <!--
    ── Angular O ring with top-right corner cut ──

    Outer octagon  96→416  with 80px corner cuts
    Inner octagon 148→364  with 64px corner cuts
    Ring thickness ~52px

    The top-right corner is sliced out, leaving a clean
    diagonal opening — the signature "Obliq cut".

    Path traces:
      outer perimeter (counter-clockwise, minus top-right corner)
      → cross to inner via right cut-face
      → inner perimeter (clockwise, minus top-right corner)
      → close via left cut-face
  -->
  <path
    d="M 336,96
       L 176,96  L 96,176
       L 96,336  L 176,416
       L 336,416 L 416,336
       L 416,176
       L 364,212
       L 364,300 L 300,364
       L 212,364 L 148,300
       L 148,212 L 212,148
       L 300,148
       Z"
    fill="url(#brand-grad)"
    filter="url(#depth)"/>

  <!-- ── Edge highlight overlay (inner bevel) ── -->
  <path
    d="M 336,96
       L 176,96  L 96,176
       L 96,336  L 176,416
       L 336,416 L 416,336
       L 416,176
       L 364,212
       L 364,300 L 300,364
       L 212,364 L 148,300
       L 148,212 L 212,148
       L 300,148
       Z"
    fill="url(#edge-grad)"
    stroke="#FFFFFF"
    stroke-width="1.5"
    stroke-opacity="0.12"/>

  <!-- ── Cut-face accent lines (exposed ring cross-section) ── -->
  <!-- Left cut edge -->
  <line x1="336" y1="96"  x2="300" y2="148"
    stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.22"
    stroke-linecap="round"/>
  <!-- Right cut edge -->
  <line x1="416" y1="176" x2="364" y2="212"
    stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.22"
    stroke-linecap="round"/>

  <!-- ── Cyan node dot at cut (top of opening) ── -->
  <circle cx="328" cy="94" r="9" fill="#38BDF8" opacity="0.9"/>
  <circle cx="328" cy="94" r="4" fill="#FFFFFF"/>
</svg>